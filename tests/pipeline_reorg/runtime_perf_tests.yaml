# This file defines the test matrix for the Runtime performance tests.
# These are host-side microbenchmarks (dispatch latency, buffer R/W bandwidth,
# JIT-build compile throughput, and PCIe mem_bench). Suites migrated to tests/perf
# run through tests/perf/test_suites.py, which compares against their goldens using
# the policy in tests/perf/suites.yaml and $PERF_ENVIRONMENT (the SKU).
#
# Each entry represents a parallel job with the following keys:
#   name: The display name for the job in GitHub Actions.
#   cmd: The exact command to run for the test.
#   skus: A mapping of SKU names to their configuration.
#     Each SKU entry contains:
#       timeout: The maximum allowed runtime for this job in minutes on that SKU.
#   owner_id: The Slack user ID to notify on failure.
#   team: The team that owns the test.

# For max allowed timeout refer to .github/time_budget.yaml

# --- Dispatch Program Latency Benchmark ---
- name: runtime_perf_pgm_dispatch
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[pgm_dispatch]"
  skus:
    wh_n300_civ2:
      timeout: 30
    bh_p150_perf:
      timeout: 30
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- Dispatch Buffer R/W Bandwidth Benchmark ---
- name: runtime_perf_rw_buffer
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[rw_buffer]"
  skus:
    wh_n300_civ2:
      timeout: 25
    bh_p150_perf:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- JIT Build (local host compile) Throughput Benchmark ---
# Adapts DISABLED_TensixCompileStress into a runtime perf gate: real attached
# device, no remote compile server, 300 cache-bypassing kernels compiled locally
# per rep (kernels are compiled, not dispatched). See the jit_build suite in
# tests/perf/suites.yaml.
- name: runtime_perf_jit_build
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[jit_build]"
  skus:
    wh_n300_civ2:
      timeout: 10
    bh_p150_perf:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf

# --- PCIe host/device bandwidth (mem_bench) ---
# Same benchmark filter and CIv2 P150b SKU as the former metal-run-microbenchmarks
# "BH P150 PCIe Performance" job. Report only until it has a golden; keep it off
# bare-metal perf runners so it does not block the dispatch/buffer jobs
# (https://github.com/tenstorrent/tt-metal/pull/28148#issuecomment-3275595011).
- name: runtime_perf_pcie_mem_bench
  cmd: |
    mkdir -p generated/test_reports
    pytest --noconftest -p tests.perf.plugin "tests/perf/test_suites.py::test_perf[pcie_mem_bench]"
  skus:
    bh_p150b_civ2_viommu:
      timeout: 10
  owner_id: U099A7FMKL2 # Manish Sudumbrekar
  team: runtime
  budget_type: perf
